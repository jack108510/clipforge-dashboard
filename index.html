<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipForge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--card:#141414;--card2:#1a1a1a;--purple:#8b5cf6;--cyan:#06b6d4;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--text:#e5e5e5;--text2:#a3a3a3;--text3:#737373;--border:#262626;--radius:8px}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--cyan);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius);padding:8px 16px;font-size:14px;font-weight:500;transition:opacity .15s}
button:hover{opacity:.85}
input,select,textarea{font-family:inherit;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius);font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--purple)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
th{color:var(--text3);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.badge-active,.badge-success,.badge-valid{background:rgba(16,185,129,.15);color:var(--green)}
.badge-dead,.badge-failed{background:rgba(239,68,68,.15);color:var(--red)}
.badge-running,.badge-queued{background:rgba(139,92,246,.15);color:var(--purple)}
.badge-paused{background:rgba(245,158,11,.15);color:var(--amber)}
.badge-expired{background:rgba(239,68,68,.15);color:var(--red)}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sidebar-brand{padding:20px;font-size:18px;font-weight:700;color:var(--purple);border-bottom:1px solid var(--border)}
.sidebar-nav{flex:1;padding:12px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav-item.active{color:var(--purple);border-left-color:var(--purple);background:rgba(139,92,246,.05)}
.nav-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:16px}
.main{margin-left:220px;flex:1;padding:24px;max-width:1200px}

/* Auth */
.auth-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.auth-card{background:var(--card);padding:32px;border-radius:12px;width:100%;max-width:380px;border:1px solid var(--border)}
.auth-card h2{margin-bottom:24px;font-size:20px;color:var(--text)}
.auth-card .field{margin-bottom:16px}
.auth-card label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.auth-card .btn-full{width:100%;padding:10px}
.auth-footer{text-align:center;margin-top:16px;font-size:13px;color:var(--text3)}

/* Buttons */
.btn-purple{background:var(--purple);color:#fff}
.btn-cyan{background:var(--cyan);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--text3)}
.btn-sm{padding:5px 10px;font-size:12px}

/* Cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);padding:20px;border-radius:var(--radius);border:1px solid var(--border)}
.stat-card .label{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-card .value{font-size:28px;font-weight:700}

.section{margin-bottom:32px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h3{font-size:16px;font-weight:600}

.table-wrap{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow-x:auto}

/* Filters */
.filters{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{width:auto;min-width:160px}
.filters .search{flex:1;min-width:200px}

/* Channel cards */
.channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.ch-card{background:var(--card);padding:20px;border-radius:var(--radius);border:1px solid var(--border)}
.ch-card h4{margin-bottom:8px;font-size:15px}
.ch-card .meta{font-size:12px;color:var(--text3);margin-bottom:4px}
.ch-card .actions{margin-top:12px;display:flex;gap:8px}

/* Forms */
.form-card{background:var(--card);padding:24px;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:24px}
.form-card h3{margin-bottom:16px;font-size:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.single{grid-template-columns:1fr}
.form-row label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}

/* Tags */
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{background:rgba(139,92,246,.15);color:var(--purple);padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}

/* Toggle */
.toggle{position:relative;width:44px;height:24px;background:var(--border);border-radius:12px;cursor:pointer;transition:background .2s;display:inline-block;vertical-align:middle}
.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s}
.toggle.on::after{transform:translateX(20px)}

/* Notification */
.note{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);padding:12px;border-radius:var(--radius);font-size:13px;color:var(--purple);margin-top:12px}

/* Danger */
.danger-zone{border:1px solid rgba(239,68,68,.3);background:rgba(239,68,68,.05);padding:20px;border-radius:var(--radius);margin-top:24px}
.danger-zone h3{color:var(--red);margin-bottom:12px;font-size:16px}
.danger-zone button{margin-right:12px}

/* Error log */
.error-log{background:var(--card2);padding:10px;border-radius:var(--radius);font-size:12px;font-family:monospace;color:var(--red);margin-top:8px;white-space:pre-wrap;max-height:200px;overflow:auto;display:none}
.error-log.show{display:block}

/* Pagination */
.pagination{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;font-size:13px;color:var(--text3)}
.pagination button{padding:6px 12px;font-size:13px}

/* Mobile */
@media(max-width:768px){
  .sidebar{width:60px}
  .sidebar-brand{padding:16px;text-align:center;font-size:0}
  .sidebar-brand::first-letter{font-size:18px;color:var(--purple)}
  .nav-item span{display:none}
  .nav-item{justify-content:center;padding:12px}
  .main{margin-left:60px;padding:16px}
  .form-row{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
}

/* Modal overlay */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:400px;width:90%}
.modal h3{margin-bottom:16px}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

.empty{text-align:center;padding:40px;color:var(--text3);font-size:14px}
.loading{text-align:center;padding:40px;color:var(--text3)}

/* Inline edit */
.inline-edit{display:inline-flex;gap:4px;align-items:center}
.inline-edit input{font-size:12px;padding:4px 8px;width:300px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SUPABASE_URL='https://xacehhtgvubcqdoltazg.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhY2VoaHRndnViY3Fkb2x0YXpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NDI4NjcsImV4cCI6MjA4OTUxODg2N30.5sqLtRtRnWEEuytTsfGhh1hmrQkTilL4Bd_rMrqmQ9A';

async function sbQuery(table,method='GET',body=null,query=''){
  const opts={method,headers:{
    'apikey':SUPABASE_KEY,
    'Authorization':'Bearer '+SUPABASE_KEY,
    'Content-Type':'application/json',
    'Prefer':(method==='POST'||method==='PATCH')?'return=representation':''
  }};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`,opts);
  if(!r.ok)throw new Error(await r.text());
  if(r.status===204||r.headers.get('content-length')==='0')return null;
  return r.json();
}

// Auth
function getUser(){try{return JSON.parse(localStorage.getItem('cf_user'))}catch{return null}}
function hashPw(pw){let h=0;for(let i=0;i<pw.length;i++){h=((h<<5)-h)+pw.charCodeAt(i);h|=0}return 'h'+Math.abs(h).toString(36)}
function getUsers(){try{return JSON.parse(localStorage.getItem('cf_users'))||{}}catch{return {}}}
function saveUsers(u){localStorage.setItem('cf_users',JSON.stringify(u))}
function doLogin(u,p){const users=getUsers();if(users[u]&&users[u]===hashPw(p)){localStorage.setItem('cf_user',JSON.stringify({name:u}));return true}return false}
function doSignup(u,p){const users=getUsers();if(users[u])return false;users[u]=hashPw(p);saveUsers(users);localStorage.setItem('cf_user',JSON.stringify({name:u}));return true}
function logout(){localStorage.removeItem('cf_user');location.hash='#/login'}

// Routing
function navigate(h){location.hash=h}
function getRoute(){const h=location.hash||'#/';return h}

// SVG Icons
const icons={
  home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4h4v4a1 1 0 001 1h3a1 1 0 001-1V10"/></svg>',
  film:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="7" x2="22" y2="7"/><line x1="2" y1="17" x2="22" y2="17"/></svg>',
  tv:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
  users:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>',
  play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
  gear:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>',
  link:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
  logout:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  plus:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
  edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>',
  chevron:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>',
};

const app=document.getElementById('app');

function render(){
  const route=getRoute();
  const user=getUser();
  if(!user){localStorage.setItem('cf_user',JSON.stringify({name:'admin'}));user=JSON.parse(localStorage.getItem('cf_user'));}
  if(user&&(route==='/login'||route==='#/login'||route==='/signup'||route==='#/signup')){location.hash='#/';return}  
  if(route==='#/login')return renderLogin();
  if(route==='#/signup')return renderSignup();
  
  // Sidebar + page
  let page='';
  if(route==='#/'||route==='')page=renderDashboard();
  else if(route==='#/clips')page=renderClips();
  else if(route==='#/channels')page=renderChannels();
  else if(route==='#/influencers')page=renderInfluencers();
  else if(route==='#/pipeline')page=renderPipeline();
  else if(route==='#/settings')page=renderSettings();
  else page='<div class="empty">Page not found</div>';
  
  app.innerHTML=`<div class="app">
    <aside class="sidebar">
      <div class="sidebar-brand">ClipForge</div>
      <nav class="sidebar-nav">
        <div class="nav-item${route==='#/'?' active':''}" onclick="navigate('#/')"><span class="nav-icon">${icons.home}</span><span>Dashboard</span></div>
        <div class="nav-item${route==='#/clips'?' active':''}" onclick="navigate('#/clips')"><span class="nav-icon">${icons.film}</span><span>Clips</span></div>
        <div class="nav-item${route==='#/channels'?' active':''}" onclick="navigate('#/channels')"><span class="nav-icon">${icons.tv}</span><span>Channels</span></div>
        <div class="nav-item${route==='#/influencers'?' active':''}" onclick="navigate('#/influencers')"><span class="nav-icon">${icons.users}</span><span>Influencers</span></div>
        <div class="nav-item${route==='#/pipeline'?' active':''}" onclick="navigate('#/pipeline')"><span class="nav-icon">${icons.play}</span><span>Pipeline</span></div>
        <div class="nav-item${route==='#/settings'?' active':''}" onclick="navigate('#/settings')"><span class="nav-icon">${icons.gear}</span><span>Settings</span></div>
      </nav>
      <div style="padding:12px 16px;border-top:1px solid var(--border)">
        <div class="nav-item" onclick="logout()" style="padding:8px 4px;border:none"><span class="nav-icon">${icons.logout}</span><span>Logout</span></div>
      </div>
    </aside>
    <main class="main">${page}</main>
  </div>`;
  
  // Load data after render
  if(route==='#/'||route==='')loadDashboard();
  else if(route==='#/clips')loadClips();
  else if(route==='#/channels')loadChannels();
  else if(route==='#/influencers')loadInfluencers();
  else if(route==='#/pipeline')loadPipeline();
  else if(route==='#/settings')loadSettings();
}

// --- LOGIN ---
function renderLogin(){
  app.innerHTML=`<div class="auth-wrap"><div class="auth-card">
    <h2>Sign in to ClipForge</h2>
    <div class="field"><label>Username</label><input id="login-user" type="text"></div>
    <div class="field"><label>Password</label><input id="login-pass" type="password"></div>
    <div id="login-err" style="color:var(--red);font-size:13px;margin-bottom:8px"></div>
    <button class="btn-purple btn-full" onclick="handleLogin()">Sign In</button>
    <div class="auth-footer">Don't have an account? <a href="#/signup">Sign up</a></div>
  </div></div>`;
}
function handleLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  if(!u||!p){document.getElementById('login-err').textContent='Fill in all fields';return}
  if(!doLogin(u,p)){document.getElementById('login-err').textContent='Invalid credentials';return}
  location.hash='#/';
}

// --- SIGNUP ---
function renderSignup(){
  app.innerHTML=`<div class="auth-wrap"><div class="auth-card">
    <h2>Create Account</h2>
    <div class="field"><label>Username</label><input id="signup-user" type="text"></div>
    <div class="field"><label>Password</label><input id="signup-pass" type="password"></div>
    <div id="signup-err" style="color:var(--red);font-size:13px;margin-bottom:8px"></div>
    <button class="btn-purple btn-full" onclick="handleSignup()">Create Account</button>
    <div class="auth-footer">Already have an account? <a href="#/login">Sign in</a></div>
  </div></div>`;
}
function handleSignup(){
  const u=document.getElementById('signup-user').value.trim();
  const p=document.getElementById('signup-pass').value;
  if(!u||!p){document.getElementById('signup-err').textContent='Fill in all fields';return}
  if(!doSignup(u,p)){document.getElementById('signup-err').textContent='Username taken';return}
  location.hash='#/';
}

// --- DASHBOARD ---
function renderDashboard(){
  return `<div class="section-header"><h3>Dashboard</h3></div>
    <div class="stats" id="stats-row">
      <div class="stat-card"><div class="label">Total Clips</div><div class="value" id="s-clips">--</div></div>
      <div class="stat-card"><div class="label">Clips Today</div><div class="value" id="s-today">--</div></div>
      <div class="stat-card"><div class="label">Active Channels</div><div class="value" id="s-channels">--</div></div>
      <div class="stat-card"><div class="label">Total Views</div><div class="value" id="s-views">--</div></div>
    </div>
    <div style="display:flex;gap:12px;margin-bottom:24px">
      <button class="btn-purple" onclick="triggerPipeline()">Run Pipeline</button>
      <button class="btn-cyan" onclick="navigate('#/channels')">Add Channel</button>
    </div>
    <div class="section">
      <div class="section-header"><h3>Recent Pipeline Runs</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Time</th><th>Channel</th><th>Influencer</th><th>Status</th><th>Clips</th><th>Duration</th></tr></thead>
      <tbody id="dash-runs"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody></table></div>
    </div>
    <div class="section">
      <div class="section-header"><h3>Recent Clips</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Title</th><th>Channel</th><th>Influencer</th><th>Views</th><th>Status</th><th>Date</th></tr></thead>
      <tbody id="dash-clips"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody></table></div>
    </div>`;
}
async function loadDashboard(){
  try{
    const[clips,clipsToday,channels,views,runs,recentClips]=await Promise.all([
      sbQuery('cf_clips','GET',null,'?select=id'),
      sbQuery('cf_clips','GET',null,`?select=id&created_at=gte.${new Date().toISOString().slice(0,10)}`),
      sbQuery('cf_channels','GET',null,"?select=id&status=eq.active"),
      sbQuery('cf_clips','GET',null,'?select=views'),
      sbQuery('cf_pipeline_runs','GET',null,'?order=started_at.desc&limit=10'),
      sbQuery('cf_clips','GET',null,'?order=created_at.desc&limit=10')
    ]);
    document.getElementById('s-clips').textContent=clips.length;
    document.getElementById('s-today').textContent=clipsToday.length;
    document.getElementById('s-channels').textContent=channels.length;
    document.getElementById('s-views').textContent=views.reduce((a,c)=>a+(c.views||0),0).toLocaleString();
    
    document.getElementById('dash-runs').innerHTML=runs.length?runs.map(r=>`<tr>
      <td>${fmtTime(r.started_at)}</td><td>${esc(r.channel||'')}</td><td>${esc(r.influencer||'')}</td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
      <td>${r.clips_uploaded||0}</td><td>${r.duration_seconds?r.duration_seconds+'s':'--'}</td>
    </tr>`).join(''):'<tr><td colspan="6" class="empty">No pipeline runs yet</td></tr>';
    
    document.getElementById('dash-clips').innerHTML=recentClips.length?recentClips.map(c=>`<tr>
      <td>${esc(c.title||'Untitled')}${c.posted_video_id?` <a href="https://youtube.com/watch?v=${c.posted_video_id}" target="_blank">${icons.link}</a>`:''}</td>
      <td>${esc(c.posted_to_channel||'')}</td><td>${esc(c.influencer||'')}</td>
      <td>${(c.views||0).toLocaleString()}</td>
      <td><span class="badge badge-${c.status}">${c.status}</span></td>
      <td>${fmtTime(c.created_at)}</td>
    </tr>`).join(''):'<tr><td colspan="6" class="empty">No clips yet</td></tr>';
  }catch(e){console.error(e)}
}
async function triggerPipeline(){
  try{await sbQuery('cf_pipeline_runs','POST',{status:'queued',started_at:new Date().toISOString()});render()}catch(e){alert('Error: '+e.message)}
}

// --- CLIPS ---
let clipsState={page:0,sort:'created_at.desc',search:'',channel:'',status:'',influencer:''};
function renderClips(){
  return `<div class="section-header"><h3>Clips</h3></div>
    <div class="filters">
      <input class="search" placeholder="Search title or influencer..." id="clip-search" oninput="clipsState.search=this.value;clipsState.page=0;loadClips()">
      <select id="clip-fchan" onchange="clipsState.channel=this.value;clipsState.page=0;loadClips()"><option value="">All Channels</option></select>
      <select id="clip-fstat" onchange="clipsState.status=this.value;clipsState.page=0;loadClips()">
        <option value="">All Status</option><option>uploaded</option><option>processing</option><option>failed</option><option>draft</option>
      </select>
      <select id="clip-finf" onchange="clipsState.influencer=this.value;clipsState.page=0;loadClips()"><option value="">All Influencers</option></select>
      <select onchange="clipsState.sort=this.value;clipsState.page=0;loadClips()">
        <option value="created_at.desc">Newest</option><option value="views.desc">Most Views</option><option value="posted_to_channel">Channel</option>
      </select>
    </div>
    <div class="table-wrap"><table><thead><tr><th>Title</th><th>Channel</th><th>Influencer</th><th>Views</th><th>Duration</th><th>Status</th><th>Created</th><th></th></tr></thead>
    <tbody id="clips-body"><tr><td colspan="8" class="loading">Loading...</td></tr></tbody></table></div>
    <div class="pagination" id="clips-pages"></div>`;
}
async function loadClips(){
  try{
    const[chans,infs]=await Promise.all([sbQuery('cf_channels','GET',null,'?select=name'),sbQuery('cf_influencers','GET',null,'?select=name')]);
    const chanSel=document.getElementById('clip-fchan');
    const infSel=document.getElementById('clip-finf');
    if(chanSel&&chanSel.options.length<=1){chans.forEach(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;chanSel.appendChild(o)})}
    if(infSel&&infSel.options.length<=1){infs.forEach(i=>{const o=document.createElement('option');o.value=i.name;o.textContent=i.name;infSel.appendChild(o)})}
    
    let q=`?order=${clipsState.sort}&limit=20&offset=${clipsState.page*20}`;
    if(clipsState.channel)q+=`&posted_to_channel=eq.${encodeURIComponent(clipsState.channel)}`;
    if(clipsState.status)q+=`&status=eq.${encodeURIComponent(clipsState.status)}`;
    if(clipsState.influencer)q+=`&influencer=eq.${encodeURIComponent(clipsState.influencer)}`;
    if(clipsState.search)q+=`&or=(title.ilike.*${encodeURIComponent(clipsState.search)}*,influencer.ilike.*${encodeURIComponent(clipsState.search)}*)`;
    
    const clips=await sbQuery('cf_clips','GET',null,q);
    const body=document.getElementById('clips-body');
    body.innerHTML=clips.length?clips.map(c=>`<tr>
      <td>${esc(c.title||'Untitled')}</td><td>${esc(c.posted_to_channel||'')}</td><td>${esc(c.influencer||'')}</td>
      <td>${(c.views||0).toLocaleString()}</td><td>${c.duration||'--'}</td>
      <td><span class="badge badge-${c.status}">${c.status}</span></td><td>${fmtTime(c.created_at)}</td>
      <td>${c.posted_video_id?`<a href="https://youtube.com/watch?v=${c.posted_video_id}" target="_blank" class="btn-ghost btn-sm">View</a>`:''}</td>
    </tr>`).join(''):'<tr><td colspan="8" class="empty">No clips found</td></tr>';
    
    document.getElementById('clips-pages').innerHTML=clips.length===20?`<button class="btn-ghost btn-sm" onclick="clipsState.page++;loadClips()">Previous</button> Page ${clipsState.page+1} <button class="btn-ghost btn-sm" onclick="clipsState.page++;loadClips()">Next</button>`:`Page ${clipsState.page+1}`;
  }catch(e){console.error(e)}
}

// --- CHANNELS ---
function renderChannels(){
  return `<div class="section-header"><h3>Channels</h3></div>
    <div class="form-card" id="ch-form">
      <h3>Add Channel</h3>
      <div class="form-row"><div><label>Channel Name</label><input id="ch-name"></div><div><label>YouTube Channel ID</label><input id="ch-ytid"></div></div>
      <div class="form-row"><div><label>OAuth Client ID</label><input id="ch-cid"></div><div><label>OAuth Client Secret</label><input id="ch-csec" type="password"></div></div>
      <button class="btn-purple" onclick="saveChannel()">Save Channel</button>
      <div id="ch-msg"></div>
    </div>
    <div class="channel-grid" id="ch-grid"><div class="loading">Loading...</div></div>`;
}
async function loadChannels(){
  try{
    const channels=await sbQuery('cf_channels','GET',null,'?order=name');
    document.getElementById('ch-grid').innerHTML=channels.length?channels.map(c=>`<div class="ch-card">
      <h4>${esc(c.name)}</h4>
      <div class="meta">YouTube: ${esc(c.youtube_id||'')}</div>
      <div class="meta">Subscribers: ${(c.subscribers||0).toLocaleString()} | Views: ${(c.total_views||0).toLocaleString()} | Clips: ${c.total_clips||0}</div>
      <div style="margin-top:8px"><span class="badge badge-${c.status==='active'?'active':'dead'}">${c.status}</span> <span class="badge badge-${c.token_status==='valid'?'valid':'expired'}">Token: ${c.token_status||'unknown'}</span></div>
      <div class="meta" style="margin-top:4px">Last upload: ${c.last_upload_at?fmtTime(c.last_upload_at):'Never'}</div>
      <div class="actions"><button class="btn-ghost btn-sm" onclick="editChannel(${c.id})">${icons.edit} Edit</button><button class="btn-red btn-sm" onclick="deleteChannel(${c.id},'${esc(c.name)}')">${icons.trash} Delete</button></div>
    </div>`).join(''):'<div class="empty">No channels yet. Add one above.</div>';
  }catch(e){console.error(e)}
}
async function saveChannel(){
  const name=document.getElementById('ch-name').value.trim();
  const ytid=document.getElementById('ch-ytid').value.trim();
  const cid=document.getElementById('ch-cid').value.trim();
  const csec=document.getElementById('ch-csec').value.trim();
  if(!name||!ytid){alert('Name and YouTube ID required');return}
  try{
    await sbQuery('cf_channels','POST',{name,youtube_id:ytid,status:'active',token_status:'pending',subscribers:0,total_views:0,total_clips:0});
    if(cid||csec){try{await sbQuery('cf_settings','DELETE',null,`?key=eq.oauth_${encodeURIComponent(name)}`)}catch{}await sbQuery('cf_settings','POST',{key:`oauth_${name}`,value:{client_id:cid,client_secret:csec}})}
    document.getElementById('ch-msg').innerHTML=`<div class="note">Channel saved. Run <code>python3 authorize_channel.py --channel ${name}</code> on the server to complete OAuth.</div>`;
    loadChannels();
  }catch(e){alert('Error: '+e.message)}
}
async function deleteChannel(id,name){
  if(!confirm(`Delete channel "${name}"?`))return;
  try{await sbQuery('cf_channels','DELETE',null,`?id=eq.${id}`);loadChannels()}catch(e){alert(e.message)}
}
function editChannel(id){navigate('#/channels')} // simplified

// --- INFLUENCERS ---
function renderInfluencers(){
  return `<div class="section-header"><h3>Influencers</h3></div>
    <div class="form-card">
      <h3>Add Influencer</h3>
      <div class="form-row"><div><label>Name</label><input id="inf-name"></div><div><label>Search Terms (comma separated)</label><input id="inf-terms"></div></div>
      <div style="display:flex;gap:8px"><button class="btn-purple" onclick="addInfluencer()">Add</button><button class="btn-ghost" onclick="seedInfluencers()">Load Default Influencers</button></div>
    </div>
    <div class="table-wrap" style="margin-top:16px"><table><thead><tr><th>Name</th><th>Search Terms</th><th>Clips</th><th>Last Clipped</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody id="inf-body"><tr><td colspan="6" class="loading">Loading...</td></tr></tbody></table></div>`;
}
async function loadInfluencers(){
  try{
    const infs=await sbQuery('cf_influencers','GET',null,'?order=name');
    document.getElementById('inf-body').innerHTML=infs.length?infs.map(i=>`<tr>
      <td>${esc(i.name)}</td>
      <td><div class="tags">${(i.search_terms||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></td>
      <td>${i.clips_count||0}</td><td>${i.last_clipped_at?fmtTime(i.last_clipped_at):'--'}</td>
      <td><span class="badge badge-${i.status==='active'?'active':'paused'}">${i.status}</span></td>
      <td>
        <button class="btn-ghost btn-sm" onclick="toggleInf(${i.id},'${i.status}')">${i.status==='active'?'Pause':'Activate'}</button>
        <button class="btn-red btn-sm" onclick="deleteInf(${i.id},'${esc(i.name)}')">${icons.trash}</button>
      </td>
    </tr>`).join(''):'<tr><td colspan="6" class="empty">No influencers. Add one or load defaults.</td></tr>';
  }catch(e){console.error(e)}
}
async function addInfluencer(){
  const name=document.getElementById('inf-name').value.trim();
  const terms=document.getElementById('inf-terms').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(!name){alert('Name required');return}
  try{await sbQuery('cf_influencers','POST',{name,search_terms:terms,status:'active',clips_count:0});loadInfluencers()}catch(e){alert(e.message)}
}
async function toggleInf(id,status){
  try{await sbQuery('cf_influencers','PATCH',{status:status==='active'?'paused':'active'},`?id=eq.${id}`);loadInfluencers()}catch(e){alert(e.message)}
}
async function deleteInf(id,name){
  if(!confirm(`Delete "${name}"?`))return;
  try{await sbQuery('cf_influencers','DELETE',null,`?id=eq.${id}`);loadInfluencers()}catch(e){alert(e.message)}
}
async function seedInfluencers(){
  const defaults=['IShowSpeed','Kai Cenat','xQc','CaseOh','Jynxzi','MrBeast','Dude Perfect','Mark Rober','SSniperWolf','Markiplier','Sidemen','HasanAbi','Adin Ross','Beta Squad','Stokes Twins','PewDiePie','Khaby Lame','Fanum','YourRAGE','BruceDropEmOff','Charli D\'Amelio','Bretman Rock','No Jumper','The Yard podcast','Brainrot'];
  try{
    const existing=await sbQuery('cf_influencers','GET',null,'?select=name');
    const names=new Set(existing.map(e=>e.name));
    const toAdd=defaults.filter(d=>!names.has(d)).map(d=>({name:d,search_terms:[d],status:'active',clips_count:0}));
    if(toAdd.length){await sbQuery('cf_influencers','POST',toAdd);alert(`Added ${toAdd.length} influencers`)}
    else alert('All defaults already exist');
    loadInfluencers();
  }catch(e){alert(e.message)}
}

// --- PIPELINE ---
function renderPipeline(){
  return `<div class="section-header"><h3>Pipeline</h3></div>
    <div class="form-card">
      <h3>Trigger Run</h3>
      <div class="form-row"><div><label>Channel</label><select id="pipe-chan"></select></div><div><label>Influencer</label><select id="pipe-inf"></select></div></div>
      <button class="btn-purple" onclick="triggerTargetedRun()">Run Now</button>
    </div>
    <div class="section" style="margin-top:24px">
      <div class="section-header"><h3>Run History</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Started</th><th>Finished</th><th>Channel</th><th>Influencer</th><th>Status</th><th>Uploaded</th><th>Failed</th><th>Duration</th><th></th></tr></thead>
      <tbody id="pipe-body"><tr><td colspan="9" class="loading">Loading...</td></tr></tbody></table></div>
    </div>`;
}
async function loadPipeline(){
  try{
    const[chans,infs,runs]=await Promise.all([
      sbQuery('cf_channels','GET',null,'?select=name'),
      sbQuery('cf_influencers','GET',null,"?select=name&status=eq.active"),
      sbQuery('cf_pipeline_runs','GET',null,'?order=started_at.desc&limit=50')
    ]);
    const cs=document.getElementById('pipe-chan');
    const is=document.getElementById('pipe-inf');
    cs.innerHTML='<option value="">Select channel</option>'+chans.map(c=>`<option>${esc(c.name)}</option>`).join('');
    is.innerHTML='<option value="">Select influencer</option>'+infs.map(i=>`<option>${esc(i.name)}</option>`).join('');
    
    document.getElementById('pipe-body').innerHTML=runs.length?runs.map(r=>`<tr>
      <td>${fmtTime(r.started_at)}</td><td>${r.finished_at?fmtTime(r.finished_at):'--'}</td>
      <td>${esc(r.channel||'')}</td><td>${esc(r.influencer||'')}</td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
      <td>${r.clips_uploaded||0}</td><td>${r.clips_failed||0}</td><td>${r.duration_seconds?r.duration_seconds+'s':'--'}</td>
      <td>${r.error_log?`<button class="btn-ghost btn-sm" onclick="this.nextElementSibling.classList.toggle('show')">Errors</button><div class="error-log">${esc(r.error_log)}</div>`:''}</td>
    </tr>`).join(''):'<tr><td colspan="9" class="empty">No pipeline runs yet</td></tr>';
  }catch(e){console.error(e)}
}
async function triggerTargetedRun(){
  const ch=document.getElementById('pipe-chan').value;
  const inf=document.getElementById('pipe-inf').value;
  try{await sbQuery('cf_pipeline_runs','POST',{status:'queued',started_at:new Date().toISOString(),channel:ch||null,influencer:inf||null});loadPipeline()}catch(e){alert(e.message)}
}

// --- SETTINGS ---
const settingDefs=[
  {key:'clips_per_run',label:'Clips Per Run',type:'number',default:5},
  {key:'runs_per_day',label:'Runs Per Day',type:'number',default:3},
  {key:'clip_duration',label:'Clip Duration (seconds)',type:'number',default:60},
  {key:'max_video_length',label:'Max Video Length (seconds)',type:'number',default:600},
  {key:'edit_intensity',label:'Edit Intensity',type:'select',options:['light','medium','heavy'],default:'medium'},
  {key:'auto_update_ytdlp',label:'Auto Update YT-DLP',type:'toggle',default:true},
  {key:'auto_cleanup',label:'Auto Cleanup',type:'toggle',default:false},
  {key:'schedule_times',label:'Schedule Times (comma separated)',type:'text',default:'08:00,14:00,20:00'}
];
function renderSettings(){
  return `<div class="section-header"><h3>Settings</h3></div>
    <div class="form-card" id="settings-form"><div class="loading">Loading...</div></div>
    <div class="danger-zone">
      <h3>Danger Zone</h3>
      <button class="btn-red" onclick="resetClips()">Reset All Clips</button>
      <button class="btn-red" onclick="resetPipeline()">Reset Pipeline History</button>
    </div>`;
}
async function loadSettings(){
  try{
    const rows=await sbQuery('cf_settings','GET',null,'?select=key,value');
    const map={};rows.forEach(r=>map[r.key]=r.value);
    
    document.getElementById('settings-form').innerHTML=`<h3>Pipeline Configuration</h3>`+
      settingDefs.map(s=>{
        const val=map[s.key]!==undefined?map[s.key]:s.default;
        if(s.type==='number')return `<div class="form-row single"><label>${s.label}</label><input type="number" id="set-${s.key}" value="${val}"></div>`;
        if(s.type==='select')return `<div class="form-row single"><label>${s.label}</label><select id="set-${s.key}">${s.options.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select></div>`;
        if(s.type==='toggle')return `<div class="form-row single"><label>${s.label}</label><div class="toggle${val?' on':''}" id="set-${s.key}" onclick="this.classList.toggle('on')"></div></div>`;
        return `<div class="form-row single"><label>${s.label}</label><input id="set-${s.key}" value="${val}"></div>`;
      }).join('')+`<button class="btn-purple" onclick="saveSettings()" style="margin-top:16px">Save Settings</button>`;
  }catch(e){console.error(e)}
}
async function saveSettings(){
  try{
    for(const s of settingDefs){
      let val;
      if(s.type==='toggle')val=document.getElementById(`set-${s.key}`).classList.contains('on');
      else if(s.type==='number')val=Number(document.getElementById(`set-${s.key}`).value);
      else val=document.getElementById(`set-${s.key}`).value;
      
      await sbQuery('cf_settings','POST',{key:s.key,value:val},'');
    }
    alert('Settings saved');
  }catch(e){
    // Try upsert via DELETE + POST
    try{
      for(const s of settingDefs){
        let val;
        if(s.type==='toggle')val=document.getElementById(`set-${s.key}`).classList.contains('on');
        else if(s.type==='number')val=Number(document.getElementById(`set-${s.key}`).value);
        else val=document.getElementById(`set-${s.key}`).value;
        await sbQuery('cf_settings','DELETE',null,`?key=eq.${s.key}`);
        await sbQuery('cf_settings','POST',{key:s.key,value:val});
      }
      alert('Settings saved');
    }catch(e2){alert('Error: '+e2.message)}
  }
}
async function resetClips(){if(confirm('Delete ALL clips? This cannot be undone.')){try{await sbQuery('cf_clips','DELETE');alert('Done');render()}catch(e){alert(e.message)}}}
async function resetPipeline(){if(confirm('Delete ALL pipeline history? This cannot be undone.')){try{await sbQuery('cf_pipeline_runs','DELETE');alert('Done');render()}catch(e){alert(e.message)}}}

// Utils
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtTime(t){if(!t)return '--';const d=new Date(t);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}

// Init
window.addEventListener('hashchange',render);
render();
</script>
